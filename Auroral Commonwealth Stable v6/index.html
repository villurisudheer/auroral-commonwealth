<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>Auroral Commonwealth — Stable v6</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section class="screen center" id="bootScreen">
      <div class="hero boot-hero">
        <div class="eyebrow">Starting National Command Network</div>
        <div class="pill version-pill">Stable v6</div>
        <h1>AURORAL<br>COMMONWEALTH</h1>
        <div class="tag">Loading simulation systems…</div>
        <div class="boot-progress" aria-label="Loading"><i></i></div>
        <p class="mini">If startup fails, v6 will show the exact module error here instead of leaving a blank screen.</p>
      </div>
    </section>
  </div>
  <noscript><div class="fatal-boot"><h2>JavaScript is required</h2><p>Enable JavaScript to run AURORAL COMMONWEALTH.</p></div></noscript>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
